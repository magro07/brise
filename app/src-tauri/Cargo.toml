[package]
name = "brise"
version = "0.1.0"
description = "Desktop-App für den Coding-Agenten Mistral Vibe"
authors = ["Max Grohmann"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "brise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
anyhow = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.17"
ignore = "0.4.33"
dirs = "7.0.0"
toml = "1.1.8"
base64 = "0.23.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
portable-pty = "0.9.0"
cpal = "0.15"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
