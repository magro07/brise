[package]
name = "brise"
version = "0.3.1"
description = "Desktop-Client für KI-Coding-Agenten (Vibe, Claude Code, Codex, Gemini) mit Zusammenarbeit im Team"
authors = ["Max Grohmann"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "brise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
anyhow = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.17"
ignore = "0.4.33"
dirs = "7.0.0"
toml = "1.1.8"
base64 = "0.23.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
portable-pty = "0.9.0"
cpal = "0.15"
regex = "1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
brise-relay = { version = "0.1.0", path = "../../relay" }
# Computer Use: Bilder skalieren/kodieren, Eingaben (XTest, CGEvent, SendInput), Not-Aus-Tastenkürzel.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
enigo = "0.6"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# X11 (Bildschirm, Fensterliste) und Wayland (xdg-desktop-portal) ohne Systembibliotheken.
x11rb = "0.13"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "screenshot"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = { version = "0.9", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
