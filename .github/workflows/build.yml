name: Build und Selbsttest

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
            test: true
          - name: Windows x64
            os: windows-latest
            args: "--bundles msi,nsis"
            test: true
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--bundles app,dmg"
            test: true
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            target: x86_64-apple-darwin
            test: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Bauen
        run: npx tauri build ${{ matrix.args }}

      - name: Selbsttest (ohne Mistral-Key)
        if: matrix.test
        shell: bash
        env:
          BRISE_DATA_DIR: ${{ runner.temp }}/brise-data
          VIBE_HOME: ${{ runner.temp }}/vibe-home
          VIBE_TEST_DISABLE_KEYRING: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=src-tauri/target/release/brise.exe; else BIN=src-tauri/target/release/brise; fi
          "$BIN" --self-test

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: brise-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: |
            app/src-tauri/target/**/release/bundle/deb/*.deb
            app/src-tauri/target/**/release/bundle/rpm/*.rpm
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  release:
    name: Release-Entwurf
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
