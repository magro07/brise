[package]
name = "brise-acp-spike"
version = "0.1.0"
edition = "2021"
description = "Spike: spricht per Agent Client Protocol mit vibe-acp"
license = "Apache-2.0"
publish = false

[[bin]]
name = "brise-acp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
open = "5"
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync"] }
